<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Enterprise Core | Offcanvas Notifications</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f6;
            height: 100vh;
            overflow: hidden;
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
        }

        /* APP WRAPPER */
        .app-wrapper {
            display: flex;
            height: 100vh;
            width: 100%;
            position: relative;
        }

        /* ========= SIDEBAR ========= */
        .sidebar {
            background: linear-gradient(145deg, #0a0f1c 0%, #0f172a 100%);
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            transition: width 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            width: 260px;
            flex-shrink: 0;
            overflow-x: hidden;
            box-shadow: 4px 0 25px rgba(0, 0, 0, 0.12);
            z-index: 1050;
        }

        .sidebar.collapsed {
            width: 80px;
        }

        .sidebar-inner {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 24px 0 20px 0;
        }

        .brand-area {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 18px;
            margin-bottom: 36px;
            gap: 12px;
            white-space: nowrap;
        }
        .brand-icon {
            font-size: 28px;
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.2);
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-text {
            font-weight: 700;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .sidebar.collapsed .brand-text { display: none; }
        .sidebar.collapsed .brand-area { justify-content: center; padding: 0; }

        /* Navigation: side-by-side (icon + text) */
        .nav-menu {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0 12px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            color: #cbd5e6;
            white-space: nowrap;
        }
        .nav-item i { font-size: 22px; width: 28px; }
        .nav-label { font-size: 0.9rem; }

        .sidebar.collapsed .nav-item {
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            padding: 10px 4px;
            text-align: center;
        }
        .sidebar.collapsed .nav-label { font-size: 0.65rem; }

        .nav-item.active {
            background: rgba(59, 130, 246, 0.25);
            color: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }
        .nav-item:hover:not(.active) {
            background: rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
        }

        .toggle-btn-wrapper {
            padding: 20px 16px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .bottom-nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            border-radius: 14px;
            cursor: pointer;
            color: #cbd5e6;
        }
        .bottom-nav-item i { font-size: 20px; width: 28px; }
        .sidebar.collapsed .bottom-nav-item {
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            padding: 10px 4px;
            text-align: center;
        }
        .sidebar.collapsed .bottom-nav-item .nav-label { font-size: 0.65rem; }

        .toggle-sidebar {
            background: rgba(45, 55, 72, 0.7);
            border: none;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 10px;
            border-radius: 40px;
            cursor: pointer;
            color: #e2e8f0;
            margin-top: 12px;
        }
        .toggle-text { white-space: nowrap; font-size: 0.8rem; }
        .sidebar.collapsed .toggle-text { display: none; }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            background: #f8fafc;
        }

        /* Top navbar */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 28px;
            background: white;
            padding: 10px 24px;
            border-radius: 32px;
            border: 1px solid #eef2f6;
        }
        .page-title-area h1 { font-size: 1.65rem; font-weight: 700; }
        .page-title-area p { color: #475569; font-size: 0.85rem; margin-top: 4px; }
        .navbar-right { display: flex; align-items: center; gap: 20px; }
        .notification-bell {
            position: relative;
            background: #f1f5f9;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .notification-bell:hover { background: #e6edf4; }
        .badge-dot {
            position: absolute;
            top: 8px;
            right: 10px;
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid white;
        }
        .user-dropdown { position: relative; }
        .user-avatar-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 60px;
            padding: 6px 14px 6px 10px;
            cursor: pointer;
        }
        .user-avatar-btn i:first-child { font-size: 22px; color: #3b82f6; }
        .user-name { font-weight: 600; display: none; }
        @media (min-width: 640px) { .user-name { display: inline-block; } }
        .dropdown-menu {
            position: absolute;
            top: 52px;
            right: 0;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
            width: 220px;
            padding: 12px 0;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.2s;
        }
        .dropdown-menu.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-item { padding: 10px 20px; display: flex; align-items: center; gap: 14px; cursor: pointer; }
        .dropdown-item:hover { background: #f1f5f9; }
        .divider { height: 1px; background: #eef2f8; margin: 8px 0; }

        /* Dashboard cards */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: white;
            border-radius: 28px;
            padding: 20px;
            border: 1px solid #edf2f7;
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-header { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
        .stat-icon {
            width: 52px; height: 52px; background: #eef2ff; border-radius: 20px;
            display: flex; align-items: center; justify-content: center; font-size: 26px; color: #2563eb;
        }
        .stat-value { font-size: 1.9rem; font-weight: 800; }
        .trend-badge { font-size: 0.75rem; color: #10b981; margin-top: 8px; display: inline-block; }
        .recent-section {
            background: white; border-radius: 28px; padding: 20px 24px; border: 1px solid #edf2f7;
        }
        .section-title { font-weight: 700; font-size: 1.2rem; margin-bottom: 20px; display: flex; gap: 12px; }
        .activity-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 0; border-bottom: 1px solid #f0f2f5;
        }
        .activity-info { display: flex; align-items: center; gap: 14px; }
        .activity-badge {
            width: 38px; height: 38px; background: #f8fafc; border-radius: 14px;
            display: flex; align-items: center; justify-content: center; color: #3b82f6;
        }

        /* ========= OFF CANVAS NOTIFICATION PANEL ========= */
        .offcanvas {
            position: fixed;
            top: 0;
            right: 0;
            width: 380px;
            max-width: 90vw;
            height: 100%;
            background: white;
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.15);
            z-index: 1200;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .offcanvas.open {
            transform: translateX(0);
        }
        .offcanvas-header {
            padding: 24px 24px 16px;
            border-bottom: 1px solid #eef2f8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .offcanvas-header h3 {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .close-offcanvas {
            background: #f1f5f9;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
        }
        .close-offcanvas:hover { background: #e2e8f0; }
        .notifications-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }
        .notification-item {
            display: flex;
            gap: 14px;
            padding: 16px 0;
            border-bottom: 1px solid #f0f2f5;
            transition: background 0.2s;
        }
        .notification-icon {
            width: 44px;
            height: 44px;
            background: #f1f5f9;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #3b82f6;
            flex-shrink: 0;
        }
        .notification-content {
            flex: 1;
        }
        .notification-title {
            font-weight: 600;
            margin-bottom: 4px;
            color: #0f172a;
        }
        .notification-time {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 4px;
        }
        .mark-read {
            font-size: 0.7rem;
            color: #3b82f6;
            cursor: pointer;
            margin-top: 6px;
            display: inline-block;
        }
        .offcanvas-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 1190;
            display: none;
            backdrop-filter: blur(2px);
        }
        .offcanvas-overlay.active {
            display: block;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                z-index: 1100;
            }
            .sidebar.mobile-open { transform: translateX(0); }
            .main-content { padding: 16px 18px; }
            .mobile-menu-btn {
                display: flex;
                background: #f1f5f9;
                width: 42px;
                height: 42px;
                align-items: center;
                justify-content: center;
                border-radius: 30px;
                cursor: pointer;
                margin-right: 8px;
            }
            .top-navbar { padding: 10px 16px; }
            .page-title-area h1 { font-size: 1.3rem; }
        }
        @media (min-width: 769px) { .mobile-menu-btn { display: none; } }
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1040;
            display: none;
        }
        .sidebar-overlay.active { display: block; }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-inner">
            <div class="brand-area">
                <div class="brand-icon"><i class="fas fa-cube"></i></div>
                <span class="brand-text">Nexify</span>
            </div>
            <div class="nav-menu">
                <div class="nav-item" data-view="dashboard"><i class="fas fa-tachometer-alt"></i><span class="nav-label">Dashboard</span></div>
                <div class="nav-item" data-view="analytics"><i class="fas fa-chart-line"></i><span class="nav-label">Analytics</span></div>
                <div class="nav-item" data-view="projects"><i class="fas fa-layer-group"></i><span class="nav-label">Projects</span></div>
                <div class="nav-item" data-view="team"><i class="fas fa-users"></i><span class="nav-label">Team</span></div>
            </div>
            <div class="toggle-btn-wrapper">
                <div class="bottom-nav-item" data-view="profile"><i class="fas fa-user-circle"></i><span class="nav-label">Profile</span></div>
                <div class="bottom-nav-item" data-view="settings"><i class="fas fa-sliders-h"></i><span class="nav-label">Settings</span></div>
                <div class="bottom-nav-item" data-view="support"><i class="fas fa-headset"></i><span class="nav-label">Support</span></div>
                <button class="toggle-sidebar" id="collapseBtn"><i class="fas fa-chevron-left" id="collapseIcon"></i><span class="toggle-text">Collapse</span></button>
            </div>
        </div>
    </aside>

    <main class="main-content" id="mainContent">
        <div class="top-navbar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div class="mobile-menu-btn" id="mobileMenuToggle"><i class="fas fa-bars"></i></div>
                <div class="page-title-area"><h1 id="dynamicTitle">Executive Dashboard</h1><p id="dynamicSub">Real-time insights & key metrics</p></div>
            </div>
            <div class="navbar-right">
                <div class="notification-bell" id="notificationBell"><i class="fas fa-bell"></i><span class="badge-dot"></span></div>
                <div class="user-dropdown">
                    <div class="user-avatar-btn" id="userAvatarBtn"><i class="fas fa-user-astronaut"></i><span class="user-name">Alex Morgan</span><i class="fas fa-chevron-down" style="font-size: 12px;"></i></div>
                    <div class="dropdown-menu" id="userDropdown"><div class="dropdown-item"><i class="fas fa-user"></i> My Profile</div><div class="dropdown-item"><i class="fas fa-cog"></i> Account Settings</div><div class="dropdown-item"><i class="fas fa-chart-pie"></i> Billing</div><div class="divider"></div><div class="dropdown-item"><i class="fas fa-sign-out-alt"></i> Sign Out</div></div>
                </div>
            </div>
        </div>
        <div id="viewContainer"></div>
    </main>
</div>

<!-- OFF CANVAS NOTIFICATION PANEL -->
<div class="offcanvas-overlay" id="offcanvasOverlay"></div>
<div class="offcanvas" id="notificationOffcanvas">
    <div class="offcanvas-header">
        <h3><i class="fas fa-bell"></i> Notifications</h3>
        <button class="close-offcanvas" id="closeOffcanvasBtn"><i class="fas fa-times"></i></button>
    </div>
    <div class="notifications-list" id="notificationsList">
        <!-- Dynamic notifications injected -->
    </div>
</div>

<script>
    (function() {
        // DOM elements
        const sidebar = document.getElementById('sidebar');
        const collapseBtn = document.getElementById('collapseBtn');
        const collapseIcon = document.getElementById('collapseIcon');
        const navItems = document.querySelectorAll('[data-view]');
        const viewContainer = document.getElementById('viewContainer');
        const mobileMenuToggle = document.getElementById('mobileMenuToggle');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const dynamicTitle = document.getElementById('dynamicTitle');
        const dynamicSub = document.getElementById('dynamicSub');
        const userAvatarBtn = document.getElementById('userAvatarBtn');
        const userDropdown = document.getElementById('userDropdown');
        const notificationBell = document.getElementById('notificationBell');
        
        // Offcanvas elements
        const offcanvas = document.getElementById('notificationOffcanvas');
        const offcanvasOverlay = document.getElementById('offcanvasOverlay');
        const closeOffcanvasBtn = document.getElementById('closeOffcanvasBtn');
        const notificationsList = document.getElementById('notificationsList');

        // ---------- NOTIFICATIONS DATA ----------
        let notifications = [
            { id: 1, title: "🚀 New deployment completed", message: "Microservices v3.2 deployed successfully to production.", time: "2 minutes ago", icon: "fa-rocket", read: false },
            { id: 2, title: "📄 Invoice ready", message: "Enterprise Gold Plan invoice for August is available.", time: "1 hour ago", icon: "fa-file-invoice", read: false },
            { id: 3, title: "🔐 Security alert", message: "New login from Chrome on Windows. Review activity.", time: "3 hours ago", icon: "fa-shield-alt", read: false },
            { id: 4, title: "📊 Weekly report", message: "Your analytics report for last week is generated.", time: "Yesterday", icon: "fa-chart-line", read: true },
            { id: 5, title: "👥 Team mention", message: "Emily mentioned you in project 'Cloud Migration'.", time: "Yesterday", icon: "fa-users", read: true }
        ];

        function renderNotifications() {
            if (!notificationsList) return;
            const unreadCount = notifications.filter(n => !n.read).length;
            const badge = document.querySelector('.badge-dot');
            if (badge) {
                if (unreadCount > 0) badge.style.display = 'block';
                else badge.style.display = 'none';
            }
            notificationsList.innerHTML = notifications.map(notif => `
                <div class="notification-item" data-id="${notif.id}">
                    <div class="notification-icon"><i class="fas ${notif.icon}"></i></div>
                    <div class="notification-content">
                        <div class="notification-title">${notif.title}</div>
                        <div class="notification-message" style="font-size:0.8rem; color:#475569;">${notif.message}</div>
                        <div class="notification-time"><i class="far fa-clock"></i> ${notif.time}</div>
                        ${!notif.read ? `<span class="mark-read" data-id="${notif.id}">Mark as read</span>` : '<span style="font-size:0.7rem; color:#94a3b8;">✓ Read</span>'}
                    </div>
                </div>
            `).join('');
            
            // attach mark read listeners
            document.querySelectorAll('.mark-read').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(el.getAttribute('data-id'));
                    const notif = notifications.find(n => n.id === id);
                    if (notif) notif.read = true;
                    renderNotifications();
                });
            });
        }

        // Open offcanvas notification panel
        function openOffcanvas() {
            offcanvas.classList.add('open');
            offcanvasOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            renderNotifications(); // refresh on open
        }
        function closeOffcanvas() {
            offcanvas.classList.remove('open');
            offcanvasOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }
        notificationBell.addEventListener('click', (e) => {
            e.stopPropagation();
            openOffcanvas();
        });
        closeOffcanvasBtn.addEventListener('click', closeOffcanvas);
        offcanvasOverlay.addEventListener('click', closeOffcanvas);

        // ---------- VIEWS ----------
        const views = {
            dashboard: `
                <div class="dashboard-grid">
                    <div class="stat-card"><div class="stat-header"><div class="stat-icon"><i class="fas fa-dollar-sign"></i></div><div><div class="stat-value">$12.4M</div><div class="stat-label">Total Revenue</div></div></div><div class="trend-badge"><i class="fas fa-arrow-up"></i> 23% vs last quarter</div></div>
                    <div class="stat-card"><div class="stat-header"><div class="stat-icon"><i class="fas fa-user-plus"></i></div><div><div class="stat-value">1,284</div><div class="stat-label">Active Users</div></div></div><div class="trend-badge"><i class="fas fa-chart-line"></i> +12% enterprise</div></div>
                    <div class="stat-card"><div class="stat-header"><div class="stat-icon"><i class="fas fa-cloud-upload-alt"></i></div><div><div class="stat-value">99.96%</div><div class="stat-label">Uptime SLA</div></div></div><div class="trend-badge"><i class="fas fa-check-circle"></i> Premium infra</div></div>
                    <div class="stat-card"><div class="stat-header"><div class="stat-icon"><i class="fas fa-tasks"></i></div><div><div class="stat-value">48</div><div class="stat-label">Active Projects</div></div></div><div class="trend-badge">34 completed on track</div></div>
                </div>
                <div class="recent-section"><div class="section-title"><i class="fas fa-clock"></i> Recent Enterprise Activity</div>
                    <div class="activity-row"><div class="activity-info"><div class="activity-badge"><i class="fas fa-rocket"></i></div><span><strong>Deployment</strong> · Microservices v3.2</span></div><span>2 hours ago</span></div>
                    <div class="activity-row"><div class="activity-info"><div class="activity-badge"><i class="fas fa-file-invoice"></i></div><span><strong>Invoice</strong> · Enterprise Gold Plan</span></div><span>Yesterday</span></div>
                    <div class="activity-row"><div class="activity-info"><div class="activity-badge"><i class="fas fa-database"></i></div><span><strong>Data Sync</strong> · Analytics warehouse</span></div><span>Aug 14, 2025</span></div>
                    <div class="activity-row"><div class="activity-info"><div class="activity-badge"><i class="fas fa-shield-alt"></i></div><span><strong>Security Audit</strong> · SOC2 passed</span></div><span>3 days ago</span></div>
                </div>
            `,
            analytics: `<div style="background:white; border-radius:28px; padding:32px;"><i class="fas fa-chart-simple" style="font-size:48px; color:#3b82f6; margin-bottom:16px; display:block;"></i><h2>Analytics Overview</h2><p>Traffic, conversion and revenue reports interactive.</p><div style="margin-top:24px; background:#f1f5f9; border-radius:24px; padding:40px; text-align:center;">📊 Enterprise analytics dashboard</div></div>`,
            projects: `<div style="background:white; border-radius:28px; padding:32px;"><h2><i class="fas fa-layer-group"></i> Active Projects</h2><div style="margin-top:20px;"><div style="padding:16px; border-bottom:1px solid #edf2f7;">✅ Nexify Cloud - 87% complete</div><div style="padding:16px; border-bottom:1px solid #edf2f7;">✅ AI Integration Suite - 62% complete</div><div style="padding:16px;">🚀 Mobile Expansion - 34% complete</div></div></div>`,
            team: `<div style="background:white; border-radius:28px; padding:32px;"><h2><i class="fas fa-users"></i> Core Team</h2><div style="display:grid; gap:16px; margin-top:24px;"><div>👩‍💻 Emily Chen - Product Lead</div><div>👨‍💻 Marcus V. - Engineering Director</div><div>👩‍🎨 Sofia R. - UX Architect</div><div>👨‍🔧 David K. - Cloud Ops</div></div></div>`,
            settings: `<div style="background:white; border-radius:28px; padding:32px;"><h2><i class="fas fa-sliders-h"></i> System Preferences</h2><p>Configure notifications, security, workspace.</p><div style="margin-top:24px;">🌙 Dark mode toggle (coming)<br/>🔔 Email alerts: ON</div></div>`,
            profile: `<div style="background:white; border-radius:28px; padding:32px;"><h2><i class="fas fa-user-circle"></i> User Profile</h2><p>Alex Morgan · alex.morgan@nexify.com</p><div style="margin-top:20px;"><button style="background:#f1f5f9; border:none; padding:8px 20px; border-radius:40px;">Edit Profile</button></div></div>`,
            support: `<div style="background:white; border-radius:28px; padding:32px;"><h2><i class="fas fa-headset"></i> Support Center</h2><p>Access documentation, live chat and ticket system.</p><div style="margin-top:20px;">📞 24/7 Enterprise Support · priority@nexify.com</div></div>`
        };

        // Sidebar collapse logic
        let isCollapsed = false;
        function toggleCollapse() {
            isCollapsed = !isCollapsed;
            if (isCollapsed) {
                sidebar.classList.add('collapsed');
                collapseIcon.classList.remove('fa-chevron-left');
                collapseIcon.classList.add('fa-chevron-right');
            } else {
                sidebar.classList.remove('collapsed');
                collapseIcon.classList.remove('fa-chevron-right');
                collapseIcon.classList.add('fa-chevron-left');
            }
            if (window.innerWidth <= 768) closeMobileSidebar();
        }
        collapseBtn.addEventListener('click', toggleCollapse);

        // Mobile sidebar
        function openMobileSidebar() { sidebar.classList.add('mobile-open'); sidebarOverlay.classList.add('active'); document.body.style.overflow = 'hidden'; }
        function closeMobileSidebar() { sidebar.classList.remove('mobile-open'); sidebarOverlay.classList.remove('active'); document.body.style.overflow = ''; }
        if (mobileMenuToggle) mobileMenuToggle.addEventListener('click', openMobileSidebar);
        sidebarOverlay.addEventListener('click', closeMobileSidebar);
        window.addEventListener('resize', () => { if(window.innerWidth > 768) closeMobileSidebar(); });

        // Set active view
        function setActiveView(viewId) {
            viewContainer.innerHTML = views[viewId] || views.dashboard;
            const titles = {
                dashboard: {title: "Executive Dashboard", sub: "Key metrics & real-time data"},
                analytics: {title: "Analytics Suite", sub: "Track performance trends"},
                projects: {title: "Project Portfolio", sub: "Manage enterprise initiatives"},
                team: {title: "Team Collaboration", sub: "Core members & roles"},
                settings: {title: "Settings", sub: "Customize workspace"},
                profile: {title: "My Profile", sub: "Account & preferences"},
                support: {title: "Support", sub: "Help & resources"}
            };
            const data = titles[viewId] || titles.dashboard;
            dynamicTitle.innerText = data.title;
            dynamicSub.innerText = data.sub;
            document.querySelectorAll('[data-view]').forEach(item => {
                if(item.getAttribute('data-view') === viewId) item.classList.add('active');
                else item.classList.remove('active');
            });
            if(window.innerWidth <= 768) closeMobileSidebar();
        }

        navItems.forEach(el => {
            el.addEventListener('click', (e) => {
                const view = el.getAttribute('data-view');
                if(view) setActiveView(view);
            });
        });

        setActiveView('dashboard');

        // User dropdown
        userAvatarBtn.addEventListener('click', (e) => { e.stopPropagation(); userDropdown.classList.toggle('show'); });
        document.addEventListener('click', (event) => { if(!userAvatarBtn.contains(event.target) && !userDropdown.contains(event.target)) userDropdown.classList.remove('show'); });
        
        // initial render notifications badge
        renderNotifications();
    })();
</script>
</body>
</html>
